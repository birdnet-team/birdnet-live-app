# Draft fdroiddata recipe (metadata/de.tu_chemnitz.mi.kahst.birdnet_live.yml).
# Submit as a merge request to https://gitlab.com/fdroid/fdroiddata; not read by this repo's build.
# Verify with `fdroid lint`, `fdroid readmeta` and `fdroid build -l <appid>` before submitting.
Categories:
  - Science & Education
License: MIT
WebSite: https://birdnet-team.github.io/birdnet-live-app/
SourceCode: https://github.com/birdnet-team/birdnet-live-app
IssueTracker: https://github.com/birdnet-team/birdnet-live-app/issues
Changelog: https://github.com/birdnet-team/birdnet-live-app/blob/HEAD/CHANGELOG.md

AutoName: BirdNET Live

RepoType: git
Repo: https://github.com/birdnet-team/birdnet-live-app

Builds:
  - versionName: 1.3.1
    versionCode: 228
    commit: v1.3.1
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.5
    rm:
      - ios
      - macos
      - windows
      - linux
      - web
    prebuild:
      # The ONNX models are Git LFS objects, which a plain clone leaves as
      # pointer files. Fetch the real files and fail on any checksum mismatch.
      - mkdir -p assets/models
      - curl -fL -o 'assets/models/BirdNET+_V3.0-preview3.1_Global_10K-pruned_FP16.onnx' 'https://media.githubusercontent.com/media/birdnet-team/birdnet-live-app/v1.3.1/assets/models/BirdNET%2B_V3.0-preview3.1_Global_10K-pruned_FP16.onnx'
      - curl -fL -o 'assets/models/BirdNET+_Geomodel_V3.0.4_Global_10K-pruned_FP16.onnx' 'https://media.githubusercontent.com/media/birdnet-team/birdnet-live-app/v1.3.1/assets/models/BirdNET%2B_Geomodel_V3.0.4_Global_10K-pruned_FP16.onnx'
      - echo '306e74f3edc5b95acc6e87ea7f3f1c701fdc0b18ec868b7615208cd6fc2f9457  assets/models/BirdNET+_V3.0-preview3.1_Global_10K-pruned_FP16.onnx' | sha256sum -c -
      - echo '198adb7bcb3cf03341ffa51fbfa7b2d295e5cd900ba09183dcfdbf6d12b5c63b  assets/models/BirdNET+_Geomodel_V3.0.4_Global_10K-pruned_FP16.onnx' | sha256sum -c -
    build:
      - export BIRDNET_FDROID=1
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter build apk --release --target-platform android-arm64

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.3.1
CurrentVersionCode: 228
